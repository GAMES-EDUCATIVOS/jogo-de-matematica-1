<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitinho • Mundo dos Códigos</title><style>*{box-sizing:border-box}body{margin:0;background:#071e32;color:white;font: bold 16px system-ui;text-align:center}main{position:relative;max-width:1280px;margin:auto}canvas{width:100%;display:block;aspect-ratio:16/9}button{background:#126b99;color:white;border:2px solid #7de7ff;border-radius:16px;padding:12px 22px;font:inherit;cursor:pointer;touch-action:none}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px black}#panel{position:absolute;inset:0;background:#061b32cc;display:grid;place-content:center;padding:20px}#panel[hidden]{display:none}#panel h1{color:#ffe67b}#answers{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#controls{display:flex;justify-content:space-between;padding:8px;touch-action:none}#controls button{font-size:24px}p{margin:8px}</style><main><canvas id="c" width="1280" height="720"></canvas><div id="hud"><span id="stats"></span><span>FLORESTA DOS PADRÕES</span></div><div id="panel"><h1>Bitinho: Mundo dos Códigos</h1><p>Explore a floresta, recolha moedas e conquiste três cristais.</p><p>Use as setas ou os botões. Pule com espaço.</p><div id="answers"><button onclick="start()">Jogar</button></div><p id="feedback"></p></div><div id="controls"><div><button data-k="ArrowLeft">◀</button> <button data-k="ArrowRight">▶</button></div><button data-k="ArrowUp">⬆ Pular</button></div></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),panel=document.querySelector('#panel'),answers=document.querySelector('#answers'),feedback=document.querySelector('#feedback'),stats=document.querySelector('#stats');let keys={},p,coins,done,lives,score,cam=0,t=0,mode='menu',last=0;const ground=[[0,650,650],[790,650,710],[1640,650,710],[2490,650,850]], platforms=[...ground,[380,510,160],[660,560,120],[1050,490,180],[1510,560,120],[1950,490,180],[2360,560,120],[2850,490,180]], shrines=[550,1420,2260], qs=[['Qual é o próximo elemento?','🔴 🔷 🔴 🔷 ?',['🔴','🔷','🟢'],0],['Complete a sequência','2, 4, 6, 8, ?',['9','10','12'],1],['Qual é o próximo comando?','↑ → → ↑ → → ?',['←','→','↑'],2]];let enemies=[];function reset(){p={x:80,y:580,vx:0,vy:0,on:false,dir:1};coins=Array.from({length:39},(_,i)=>({x:130+i*79,y:570-Math.sin(i*1.7)**2*65,got:false}));done=[false,false,false];lives=3;score=0;cam=0;enemies=[{x:950,base:950},{x:1830,base:1830},{x:2720,base:2720}];}reset();function start(){reset();mode='play';panel.hidden=true;keys={}}function modal(title,body,opts,fn){mode='modal';keys={};panel.hidden=false;panel.querySelector('h1').textContent=title;panel.querySelectorAll('p')[0].textContent=body;panel.querySelectorAll('p')[1].textContent='';feedback.textContent='';answers.innerHTML='';opts.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>fn(i);answers.append(b)})}function quiz(i){let q=qs[i];modal(q[0],q[1],q[2],n=>{if(n!==q[3]){feedback.textContent='Observe o padrão e tente novamente!';return}done[i]=true;score+=100;panel.hidden=true;mode='play'})}function hurt(){lives--;if(!lives){modal('Tente novamente!','Você pode aprender com cada tentativa.',['Recomeçar'],start);return}p.x= p.x<790?80:p.x<1640?810:p.x<2490?1660:2510;p.y=530;p.vy=0;p.inv=100}function update(){if(mode!=='play')return;p.inv=Math.max(0,(p.inv||0)-1);p.vx=(keys.ArrowRight||keys.d?5.8:0)-(keys.ArrowLeft||keys.a?5.8:0);if(p.vx)p.dir=Math.sign(p.vx);if((keys.ArrowUp||keys[' ']||keys.w)&&p.on){p.vy=-17;p.on=false}let old=p.y+64;p.x=Math.max(0,Math.min(3280,p.x+p.vx));p.vy+=.65;p.y+=p.vy;p.on=false;for(let [x,y,w] of platforms)if(p.x+38>x&&p.x<x+w&&old<=y+1&&p.y+64>=y&&p.vy>=0){p.y=y-64;p.vy=0;p.on=true}if(p.y>800)hurt();for(let a of coins)if(!a.got&&Math.hypot(p.x+20-a.x,p.y+30-a.y)<38){a.got=true;score+=10}enemies.forEach(e=>{e.x=e.base+Math.sin(t*.025+e.base)*70;if(!p.inv&&Math.abs(p.x-e.x)<42&&p.y+64>605&&p.y<650){if(p.vy>1&&p.y<590){p.vy=-12;e.base=-1000;score+=30}else hurt()}});shrines.forEach((x,i)=>{if(mode==='play'&&!done[i]&&Math.abs(p.x-x)<42&&p.y>490)quiz(i)});if(p.x>3170){if(done.every(Boolean))modal('Missão concluída!','Você conquistou os três cristais! Pontuação: '+score,['Jogar novamente'],start);else {p.x=3100;modal('Portal bloqueado','Volte e resolva os três desafios.',['Continuar'],()=>{mode='play';panel.hidden=true})}}cam=Math.max(0,Math.min(2060,p.x-420));}
function ellipse(x,y,a,b,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,a,b,0,0,7);g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function round(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function draw(){let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#157ac4');sky.addColorStop(.6,'#a3e8ef');sky.addColorStop(1,'#d5f4bb');rect(0,0,1280,720,sky);ellipse(1080,110,65,65,'#fff1ae');for(let i=0;i<10;i++){let x=((i*240-cam*.12+t*.18)%1600+1600)%1600-160;ellipse(x,100+i%3*52,100,23,'#e4f9ff');ellipse(x+35,82+i%3*52,50,32,'#f4fcff')}for(let layer=0;layer<3;layer++){g.fillStyle=['#77b6c3','#448d92','#246e70'][layer];g.beginPath();g.moveTo(0,720);for(let x=-100;x<1400;x+=40)g.lineTo(x,340+layer*65+Math.sin((x+cam*(.17+layer*.13))*.008+layer)*85+Math.cos((x+cam*.2)*.019)*30);g.lineTo(1280,720);g.fill()}for(let i=0;i<16;i++){let x=i*170-cam*.55;rect(x,330,22,390,'#245c58');for(let j=0;j<5;j++)ellipse(x+Math.sin(j*3)*55,330+j*37,75,29,'#348d68')}for(let i=0;i<3;i++){let x=350+i*550-cam*.35;rect(x,300,62,420,'#80ddec99');for(let j=0;j<8;j++)rect(x+j*8,300+(t*5+j*47)%400,3,35,'#e5ffffaa')}g.save();g.translate(-cam,0);for(let [x,y,w] of platforms){let grad=g.createLinearGradient(0,y,0,y+100);grad.addColorStop(0,'#aa7851');grad.addColorStop(1,'#493d45');round(x,y,w,110,14,grad);for(let j=0;j<w;j+=45){g.strokeStyle='#503d39';g.lineWidth=2;g.strokeRect(x+j,y+18,Math.min(45,w-j),40)}round(x,y-10,w,22,9,'#397d36');round(x,y-12,w,10,5,'#b5e950');for(let j=12;j<w;j+=22){ellipse(x+j,y-13,9,4,'#76bf35');if(j%3===0)ellipse(x+j,y-21,4,4,'#ffd47c')}}for(let a of coins)if(!a.got){let y=a.y+Math.sin(t*.08+a.x)*5;g.shadowColor='#ffe566';g.shadowBlur=15;ellipse(a.x,y,7+Math.abs(Math.cos(t*.07))*9,17,'#ffcf32');g.shadowBlur=0;ellipse(a.x,y,4,11,'#fff3a0')}shrines.forEach((x,i)=>{round(x-15,578,65,72,10,'#34566d');g.shadowColor=done[i]?'#6bffad':'#ffe05a';g.shadowBlur=22;ellipse(x+17,575+Math.sin(t*.06)*6,23,28,done[i]?'#59f5a0':'#ffc43e');g.shadowBlur=0;g.fillStyle='#16384b';g.font='bold 25px system-ui';g.fillText(done[i]?'✓':'?',x+9,583)});enemies.forEach(e=>{ellipse(e.x+20,632,24,17,'#d64a48');ellipse(e.x+20,617,27,15,'#ff8060');ellipse(e.x+12,631,4,5,'white');ellipse(e.x+27,631,4,5,'white')});g.strokeStyle=done.every(Boolean)?'#70faff':'#8798a4';g.lineWidth=15;g.beginPath();g.ellipse(3200,570,45,75,0,0,7);g.stroke();ellipse(3200,570,36,65,done.every(Boolean)?'#36c8e5':'#344b62');g.save();g.translate(p.x+20,p.y+30);g.scale(p.dir,1);if(p.inv&&t%10<5)g.globalAlpha=.4;let walk=p.on&&p.vx?Math.sin(t*.28)*9:0;ellipse(-13,8,12,18,'#e88b32');round(-13,-2,27,29,9,'#176ab3');round(-12+walk,22,11,17,5,'#243b58');round(3-walk,22,11,17,5,'#243b58');ellipse(-6+walk,39,10,5,'#e8f4ff');ellipse(9-walk,39,10,5,'#e8f4ff');ellipse(0,-13,19,20,'#f7ba82');ellipse(-4,-26,20,11,'#59351e');ellipse(10,-13,4,6,'#18324b');ellipse(12,-3,6,3,'#b95d45');round(-15,-31,30,10,5,'#27455e');ellipse(5,-26,9,6,'#66e2ff');ellipse(15,10+walk*.5,6,9,'#f7ba82');g.restore();let rx=p.x-45,ry=p.y-24+Math.sin(t*.09)*8;ellipse(rx,ry,23,19,'#edfaff');round(rx-16,ry-10,32,20,9,'#183f64');ellipse(rx-7,ry,3,5,'#63faff');ellipse(rx+7,ry,3,5,'#63faff');ellipse(rx,ry+20,8,5,'#60e8ff');g.restore();stats.textContent='❤️ '+lives+'   🪙 '+score+'   💎 '+done.filter(Boolean).length+'/3';}function loop(now){if(now-last>15){t++;update();draw();last=now}requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();keys[e.key]=true});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('blur',()=>keys={});document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[b.dataset.k]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[b.dataset.k]=false});</script></html>
